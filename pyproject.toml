[tool.poetry]
name = "electronics-network"
version = "0.1.0"
description = "Сеть по продаже электроники: Django + DRF + PostgreSQL"
authors = ["Mikhail Shumkin <you@example.com>"]
readme = "README.md"
packages = [{ include = "network" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
Django = "4.2.15"
djangorestframework = "3.15.2"
django-filter = "24.2"
python-dotenv = "1.0.1"
psycopg2-binary = "2.9.9"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.9"
isort = "^5.13.2"
pre-commit = "^3.8.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I"]



